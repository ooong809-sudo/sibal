<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1b2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="탷정">
  <title>탷정 - 우리의 마지막 대화</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- 타이틀 화면 -->
    <section id="title-screen" class="screen active">
      <p class="app-name">탷정</p>

      <div class="title-area">
        <div class="bubble-icon" aria-hidden="true">💬</div>
        <h1>우리의 마지막 대화</h1>
        <p class="tagline">크게 싸운 그날 밤, 태현에게서 메시지가 왔다.</p>
      </div>

      <div class="info-card">
        <h2>게임 설명</h2>
        <ul>
          <li>당신은 <strong>정우</strong>가 되어 이야기를 진행해요.</li>
          <li>태현과 크게 싸운 직후, 도착한 메시지를 확인하는 것으로 시작돼요.</li>
          <li>서먹하지만 서로가 신경 쓰이는 두 사람. 당신의 선택이 관계를 바꿔요.</li>
        </ul>
      </div>

      <button id="start-btn" class="start-btn" type="button">게임 시작</button>
    </section>

    <!-- 안내 메시지 (버튼 눌렀을 때 잠깐 뜸) -->
    <div id="toast" class="toast" role="status"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
